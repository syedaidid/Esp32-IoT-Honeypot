<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Hive Sentinel — IoT Honeypot{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    :root {
      --bg:        #070b14;
      --bg-deep:   #04060c;
      --panel:     #0d1526;
      --panel-2:   #111b30;
      --glass:     rgba(15, 23, 42, 0.72);
      --line:      rgba(148, 163, 184, 0.10);
      --line-soft: rgba(148, 163, 184, 0.06);
      --line-hi:   rgba(148, 163, 184, 0.18);

      --cyan:      #22d3ee;
      --teal:      #2dd4bf;
      --violet:    #a78bfa;
      --blue:      #60a5fa;
      --red:       #f87171;
      --orange:    #fb923c;
      --amber:     #fbbf24;
      --green:     #34d399;

      --text:      #e2e8f0;
      --muted:     #94a3b8;
      --dim:       #64748b;
      --faint:     #475569;

      --font-ui:   'Inter', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;

      --radius:    14px;
      --radius-sm: 10px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scrollbar-color: #24324a #070b14; }
    body {
      font-family: var(--font-ui);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      position: relative;
      -webkit-font-smoothing: antialiased;
    }
    /* Aurora glows + fine dot grid */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(900px 480px at 12% -8%, rgba(34, 211, 238, 0.07), transparent 60%),
        radial-gradient(800px 500px at 88% 0%, rgba(167, 139, 250, 0.06), transparent 55%),
        radial-gradient(700px 500px at 50% 115%, rgba(45, 212, 191, 0.05), transparent 60%),
        radial-gradient(circle at center, rgba(148, 163, 184, 0.05) 1px, transparent 1px);
      background-size: auto, auto, auto, 26px 26px;
    }
    ::selection { background: rgba(34, 211, 238, 0.30); }

    /* ── Scrollbar ── */
    ::-webkit-scrollbar { width: 10px; height: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: #1e2b45; border-radius: 8px; border: 2px solid var(--bg-deep); }
    ::-webkit-scrollbar-thumb:hover { background: #2c3d5e; }

    /* ── Navbar ── */
    nav.navbar {
      background: rgba(7, 11, 20, 0.78);
      backdrop-filter: blur(14px) saturate(1.4);
      -webkit-backdrop-filter: blur(14px) saturate(1.4);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 28px; min-height: 64px; flex-wrap: wrap; gap: 8px;
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-hex { width: 36px; height: 36px; filter: drop-shadow(0 0 10px rgba(34, 211, 238, 0.35)); }
    .logo-hex .core { transform-origin: 20px 20px; animation: hexPulse 2.4s ease-in-out infinite; }
    @keyframes hexPulse { 0%,100% { opacity:.55; r: 2.4; } 50% { opacity:1; r: 3.4; } }
    .brand .name { display: flex; flex-direction: column; line-height: 1.2; }
    .brand .name b {
      font-weight: 800; font-size: 16.5px; letter-spacing: .01em;
      background: linear-gradient(90deg, #e0f2fe, var(--cyan) 55%, var(--violet));
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .brand .name small { font-family: var(--font-mono); font-size: 8.5px; color: var(--dim); letter-spacing: .30em; }

    nav .links { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
    nav .links a {
      font-family: var(--font-ui); font-weight: 500; font-size: 13px;
      text-decoration: none; color: var(--muted);
      padding: 8px 15px; border-radius: 999px; transition: all .18s;
      position: relative;
    }
    nav .links a:hover { color: var(--text); background: rgba(148, 163, 184, 0.08); }
    nav .links a.active {
      color: var(--cyan);
      background: rgba(34, 211, 238, 0.10);
      box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.25);
    }

    .navbar .right { display: flex; align-items: center; gap: 12px; }
    .live-pill {
      display: flex; align-items: center; gap: 7px;
      font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .14em;
      color: var(--green); background: rgba(52, 211, 153, 0.08);
      border: 1px solid rgba(52, 211, 153, 0.25); border-radius: 999px; padding: 5px 12px;
    }
    .live-pill .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: pulseDot 1.8s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.45; transform: scale(.8); } }
    .user {
      font-family: var(--font-mono); font-size: 11.5px; color: var(--muted);
      padding: 5px 13px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--bg-deep);
    }
    .user b { color: var(--text); font-weight: 600; }
    .logout {
      font-family: var(--font-ui); font-weight: 500; font-size: 12px;
      background: transparent; color: var(--muted); cursor: pointer;
      padding: 7px 15px; border: 1px solid var(--line); border-radius: 999px; transition: all .18s;
    }
    .logout:hover { color: var(--red); border-color: rgba(248, 113, 113, 0.5); background: rgba(248, 113, 113, 0.08); }

    .container { padding: 28px 28px 70px; max-width: 1480px; margin: 0 auto; }

    /* ── Typography ── */
    .page-title {
      font-weight: 800; font-size: 24px; color: var(--text); letter-spacing: -0.02em;
      display: flex; align-items: center; gap: 13px;
    }
    .page-title::before {
      content: ''; width: 5px; height: 27px; border-radius: 3px;
      background: linear-gradient(180deg, var(--cyan), var(--violet));
      box-shadow: 0 0 14px rgba(34, 211, 238, 0.55);
    }
    .subtitle { font-family: var(--font-mono); font-size: 11px; color: var(--dim); letter-spacing: .16em; text-transform: uppercase; margin-top: 8px; }

    /* ── Sentry status line ── */
    .status-line {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em;
      color: var(--muted); margin: 6px 0 24px; padding: 10px 16px;
      background: rgba(34, 211, 238, 0.04); border: 1px solid rgba(34, 211, 238, 0.14);
      border-radius: var(--radius-sm);
    }
    .status-line .live { color: var(--green); font-weight: 600; }
    .status-line .sep { color: var(--faint); }

    /* ── Cards (glass panels) ── */
    .card {
      background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
      position: relative; padding: 22px; margin-bottom: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 20px 45px -30px rgba(0, 0, 0, 0.9);
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 22px; right: 22px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(34, 211, 238, 0.35), transparent);
      border-radius: 1px;
    }
    .card h3 {
      font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .20em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 18px; font-weight: 600;
    }
    .card h3 .gold { color: var(--cyan); }

    /* ── Metric stat cards ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(165px, 1fr));
      gap: 16px; margin-bottom: 26px;
    }
    .stat-card {
      background: linear-gradient(180deg, var(--panel-2) 0%, var(--panel) 100%);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 18px 18px; position: relative; overflow: hidden;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }
    .stat-card::after {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--cyan), transparent);
      opacity: .85;
    }
    .stat-card:hover { transform: translateY(-3px); border-color: var(--line-hi); box-shadow: 0 16px 34px -20px rgba(34, 211, 238, 0.30); }
    .stat-card .number {
      font-family: var(--font-mono); font-weight: 700; font-size: 30px; line-height: 1.1;
      color: var(--text);
      text-shadow: 0 0 22px rgba(34, 211, 238, 0.30);
    }
    .stat-card .label {
      font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em;
      text-transform: uppercase; color: var(--muted); margin-top: 7px;
    }
    .stat-card.red::after    { background: linear-gradient(90deg, var(--red), transparent); }
    .stat-card.red .number   { color: var(--red);    text-shadow: 0 0 22px rgba(248, 113, 113, 0.35); }
    .stat-card.green::after  { background: linear-gradient(90deg, var(--green), transparent); }
    .stat-card.green .number { color: var(--green);  text-shadow: 0 0 22px rgba(52, 211, 153, 0.35); }
    .stat-card.yellow::after { background: linear-gradient(90deg, var(--amber), transparent); }
    .stat-card.yellow .number{ color: var(--amber);  text-shadow: 0 0 22px rgba(251, 191, 36, 0.35); }
    .stat-card.purple::after { background: linear-gradient(90deg, var(--violet), transparent); }
    .stat-card.purple .number{ color: var(--violet); text-shadow: 0 0 22px rgba(167, 139, 250, 0.35); }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
      text-align: left; padding: 10px 14px; color: var(--dim);
      border-bottom: 1px solid var(--line); font-weight: 600;
      background: rgba(148, 163, 184, 0.03);
    }
    td { padding: 12px 14px; border-bottom: 1px solid var(--line-soft); font-size: 13px; }
    tbody tr { transition: background .14s; }
    tbody tr:hover td { background: rgba(34, 211, 238, 0.04); }
    tbody tr.row-new { animation: rowFlash 2.4s ease; }
    @keyframes rowFlash {
      0%   { background: rgba(34, 211, 238, 0.20); }
      100% { background: transparent; }
    }
    td .payload, td.tabular { font-family: var(--font-mono); }

    /* ── Rounded badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px;
      border-radius: 999px;
      font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .02em;
      border: 1px solid transparent;
    }
    .badge.port_scan         { background: rgba(248, 113, 113, 0.10); color: var(--red);    border-color: rgba(248, 113, 113, 0.25); }
    .badge.brute_force       { background: rgba(251, 191, 36, 0.10);  color: var(--amber);  border-color: rgba(251, 191, 36, 0.25); }
    .badge.connection_attempt{ background: rgba(96, 165, 250, 0.10);  color: var(--blue);   border-color: rgba(96, 165, 250, 0.25); }
    .badge.http_scan         { background: rgba(52, 211, 153, 0.10);  color: var(--green);  border-color: rgba(52, 211, 153, 0.25); }
    .badge.http_brute_force  { background: rgba(251, 146, 60, 0.10);  color: var(--orange); border-color: rgba(251, 146, 60, 0.25); }
    .badge.admin_panel_access{ background: rgba(167, 139, 250, 0.10); color: var(--violet); border-color: rgba(167, 139, 250, 0.25); }
    .badge.ip_blocked        { background: rgba(248, 113, 113, 0.15); color: var(--red);    border-color: rgba(248, 113, 113, 0.40); }

    .empty { color: var(--dim); font-size: 12.5px; padding: 14px 4px; font-family: var(--font-mono); }
    .link { color: var(--cyan); text-decoration: none; font-weight: 500; transition: color .15s; }
    .link:hover { color: #67e8f9; text-decoration: underline; text-underline-offset: 3px; }

    /* ── Buttons ── */
    .btn {
      display: inline-block; text-decoration: none; cursor: pointer;
      font-family: var(--font-ui); font-weight: 600; font-size: 12.5px;
      color: #04121a; padding: 10px 20px; border: 0; border-radius: 10px;
      background: linear-gradient(135deg, #67e8f9, var(--cyan));
      box-shadow: 0 8px 20px -10px rgba(34, 211, 238, 0.55);
      transition: filter .18s, transform .15s, box-shadow .18s;
    }
    .btn:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 12px 26px -10px rgba(34, 211, 238, 0.7); }
    .btn.ghost {
      background: transparent; color: var(--cyan);
      box-shadow: inset 0 0 0 1px rgba(34, 211, 238, 0.35);
    }
    .btn.ghost:hover { color: #67e8f9; box-shadow: inset 0 0 0 1px var(--cyan), 0 10px 24px -12px rgba(34, 211, 238, 0.5); }

    /* ── Form fields ── */
    .field {
      background: var(--bg-deep); border: 1px solid var(--line); border-radius: 10px;
      color: var(--text); padding: 9px 13px; font-family: var(--font-mono); font-size: 12.5px;
      transition: border-color .18s, box-shadow .18s;
    }
    .field:focus { outline: none; border-color: rgba(34, 211, 238, 0.6); box-shadow: 0 0 0 3px rgba(34, 211, 238, 0.12); }
    .field::placeholder { color: var(--dim); }
    .field::-webkit-calendar-picker-indicator { filter: invert(.7) sepia(.6) saturate(3) hue-rotate(160deg); }

    .filterbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    /* ── Pagination ── */
    .pagination { display: flex; gap: 6px; align-items: center; margin-top: 20px; flex-wrap: wrap; }
    .pagination a, .pagination span {
      font-family: var(--font-mono); font-size: 12px; text-decoration: none;
      padding: 7px 13px; color: var(--muted); background: var(--bg-deep);
      border: 1px solid var(--line); border-radius: 8px;
      transition: all .15s;
    }
    .pagination a:hover { color: var(--cyan); border-color: rgba(34, 211, 238, 0.4); }
    .pagination .current {
      color: #04121a; font-weight: 700; border-color: transparent;
      background: linear-gradient(135deg, #67e8f9, var(--cyan));
    }

    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .toolbar .spacer { flex: 1; }

    /* ── Console-style live feed ── */
    .console { padding: 0 !important; overflow: hidden; }
    .console .console-bar {
      display: flex; align-items: center; gap: 10px;
      font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--muted); padding: 12px 16px;
      background: rgba(34, 211, 238, 0.05); border-bottom: 1px solid var(--line);
    }
    .console .console-bar .rec { color: var(--red); animation: blink 1.4s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .console table { margin: 0; }
    .console td, .console th { padding-left: 18px; padding-right: 18px; font-family: var(--font-mono); font-size: 12px; }

    /* Alert banner */
    .alert-banner {
      display: none; align-items: center; gap: 12px;
      background: linear-gradient(90deg, rgba(248, 113, 113, 0.12), rgba(251, 146, 60, 0.06));
      border: 1px solid rgba(248, 113, 113, 0.45);
      border-radius: var(--radius-sm);
      padding: 12px 18px; margin-bottom: 22px;
      font-family: var(--font-mono); font-size: 12.5px;
      box-shadow: 0 10px 30px -18px rgba(248, 113, 113, 0.5);
    }
    .alert-banner.show { display: flex; animation: slideIn .28s ease; }
    .alert-banner b { color: var(--red); letter-spacing: .1em; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

    /* Page fade-in */
    .container > * { animation: fadeUp .45s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    @media (max-width: 760px) {
      .navbar { justify-content: center; padding: 10px 14px; }
      .container { padding: 18px 14px 50px; }
      .brand .name small { display: none; }
      .page-title { font-size: 19px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .live-pill { display: none; }
    }
  </style>
  {% block head_css %}{% endblock %}
</head>
<body>

<nav class="navbar">
  <a class="brand" href="{% url 'dashboard' %}">
    <svg class="logo-hex" viewBox="0 0 40 40">
      <defs><linearGradient id="hexg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#a78bfa"/>
      </linearGradient></defs>
      <path d="M20 2 36 11v18L20 38 4 29V11z" fill="none" stroke="url(#hexg)" stroke-width="2"/>
      <path d="M20 8 30 14v12L20 32 10 26V14z" fill="rgba(34,211,238,0.10)" stroke="url(#hexg)" stroke-width="1"/>
      <circle class="core" cx="20" cy="20" r="2.8" fill="#67e8f9"/>
    </svg>
    <span class="name">
      <b>Hive Sentinel</b>
      <small>IoT HONEYPOT CONSOLE</small>
    </span>
  </a>
  <div class="links">
    <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="{% url 'attack_logs' %}" class="{% if request.resolver_match.url_name == 'attack_logs' %}active{% endif %}">Attack Log</a>
    <a href="{% url 'attackers' %}" class="{% if request.resolver_match.url_name == 'attackers' or request.resolver_match.url_name == 'attacker_detail' %}active{% endif %}">Attackers</a>
    <a href="{% url 'reports' %}" class="{% if request.resolver_match.url_name == 'reports' %}active{% endif %}">Reports</a>
  </div>
  <div class="right">
    <span class="live-pill"><span class="dot"></span>LIVE</span>
    <span class="user">{{ request.user.username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="logout">Logout</button>
    </form>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

{% block scripts %}{% endblock %}
</body>
</html>
