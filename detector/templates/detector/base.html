<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Hive Sentinel — IoT Honeypot{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap');

    :root {
      --bg:        #0a0a0a;
      --bg-deep:   #060606;
      --panel:     #111111;
      --panel-2:   #141414;
      --line:      #1e1e1e;
      --line-soft: #161616;
      --line-hi:   #2a2a2a;

      --green:     #4ade80;
      --green-dim: #22c55e;
      --green-fade: rgba(74, 222, 128, 0.10);
      --red:       #f87171;
      --red-hot:   #ef4444;
      --red-fade:  rgba(239, 68, 68, 0.10);
      --orange:    #fb923c;
      --amber:     #fbbf24;
      --violet:    #a78bfa;
      --cyan:      #22d3ee;

      --text:      #d4d4d4;
      --muted:     #8a8a8a;
      --dim:       #565656;
      --faint:     #3a3a3a;

      --mono: 'JetBrains Mono', ui-monospace, 'Cascadia Code', Consolas, monospace;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scrollbar-color: #2a2a2a #0a0a0a; }
    body {
      font-family: var(--mono);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    /* faint scanline wash — keeps it terminal without CRT cosplay */
    body::before {
      content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(1000px 500px at 50% -10%, rgba(74, 222, 128, 0.035), transparent 55%),
        repeating-linear-gradient(0deg, rgba(255,255,255,0.012) 0 1px, transparent 1px 3px);
    }
    ::selection { background: rgba(74, 222, 128, 0.28); color: #eafff2; }

    ::-webkit-scrollbar { width: 9px; height: 9px; }
    ::-webkit-scrollbar-track { background: var(--bg-deep); }
    ::-webkit-scrollbar-thumb { background: #242424; border-radius: 6px; }
    ::-webkit-scrollbar-thumb:hover { background: #333; }

    /* ── Navbar ── */
    nav.navbar {
      background: rgba(10, 10, 10, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 26px; min-height: 58px; flex-wrap: wrap; gap: 8px;
      position: sticky; top: 0; z-index: 100;
    }
    .brand { display: flex; align-items: center; gap: 12px; text-decoration: none; }
    .logo-hex { width: 32px; height: 32px; filter: drop-shadow(0 0 8px rgba(74, 222, 128, 0.35)); }
    .logo-hex .core { transform-origin: 20px 20px; animation: hexPulse 2.4s ease-in-out infinite; }
    @keyframes hexPulse { 0%,100% { opacity:.55; r: 2.4; } 50% { opacity:1; r: 3.4; } }
    .brand .name { display: flex; flex-direction: column; line-height: 1.2; }
    .brand .name b { font-weight: 700; font-size: 15px; color: var(--green); letter-spacing: .02em; }
    .brand .name b::before { content: '> '; color: var(--dim); }
    .brand .name small { font-size: 8.5px; color: var(--dim); letter-spacing: .28em; }

    nav .links { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
    nav .links a {
      font-size: 12px; text-decoration: none; color: var(--muted);
      padding: 7px 13px; border-radius: 6px; transition: all .15s;
      border: 1px solid transparent;
    }
    nav .links a:hover { color: var(--text); background: var(--panel-2); }
    nav .links a.active {
      color: var(--green); background: var(--green-fade);
      border-color: rgba(74, 222, 128, 0.25);
    }
    nav .links a.active::before { content: '▸ '; }

    .navbar .right { display: flex; align-items: center; gap: 12px; }
    .live-pill {
      display: flex; align-items: center; gap: 7px;
      font-size: 10px; font-weight: 700; letter-spacing: .16em;
      color: var(--green); background: var(--green-fade);
      border: 1px solid rgba(74, 222, 128, 0.3); border-radius: 999px; padding: 4px 11px;
    }
    .live-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 7px var(--green); animation: pulseDot 1.6s ease-in-out infinite; }
    @keyframes pulseDot { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:.4; transform: scale(.75); } }
    .user {
      font-size: 11px; color: var(--muted);
      padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px;
      background: var(--bg-deep);
    }
    .user b { color: var(--text); font-weight: 600; }
    .logout {
      font-family: var(--mono); font-size: 11px; background: transparent; color: var(--muted); cursor: pointer;
      padding: 6px 14px; border: 1px solid var(--line); border-radius: 999px; transition: all .15s;
    }
    .logout:hover { color: var(--red); border-color: rgba(248, 113, 113, 0.5); background: var(--red-fade); }

    .container { padding: 26px 26px 64px; max-width: 1500px; margin: 0 auto; }

    /* ── Typography (terminal) ── */
    .page-title {
      font-weight: 700; font-size: 20px; color: var(--text); letter-spacing: -.01em;
      display: flex; align-items: center; gap: 11px;
    }
    .page-title::before { content: '//'; color: var(--green); font-weight: 600; }
    .subtitle { font-size: 10.5px; color: var(--dim); letter-spacing: .18em; text-transform: uppercase; margin-top: 7px; }

    /* ── Sentry status line (CLI prompt style) ── */
    .status-line {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      font-size: 11px; letter-spacing: .06em;
      color: var(--muted); margin: 6px 0 22px; padding: 9px 14px;
      background: var(--bg-deep); border: 1px solid var(--line);
      border-radius: 8px;
    }
    .status-line .live { color: var(--green); font-weight: 600; }
    .status-line .sep { color: var(--faint); }
    .status-line::before { content: 'sentinel@hive:~$'; color: var(--green-dim); opacity: .8; margin-right: 2px; }

    /* ── Cards ── */
    .card {
      background: var(--panel);
      position: relative; padding: 20px; margin-bottom: 22px;
      border: 1px solid var(--line);
      border-radius: 10px;
    }
    .card h3 {
      font-size: 10px; letter-spacing: .20em;
      text-transform: uppercase; color: var(--dim); margin-bottom: 16px; font-weight: 600;
    }
    .card h3 .gold { color: var(--green); }

    /* ── Stat bar (CSS Grid) ── */
    .stats-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px; margin-bottom: 24px;
    }
    .stat-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--green);
      border-radius: 8px;
      padding: 16px 18px; position: relative;
      transition: border-color .15s, background .15s, transform .15s;
    }
    .stat-card:hover { border-color: var(--line-hi); background: var(--panel-2); transform: translateY(-2px); }
    .stat-card .number {
      font-weight: 700; font-size: 27px; line-height: 1.15; color: var(--text);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 16px rgba(74, 222, 128, 0.18);
    }
    .stat-card .label {
      font-size: 9.5px; letter-spacing: .16em;
      text-transform: uppercase; color: var(--muted); margin-top: 6px;
    }
    .stat-card.red     { border-left-color: var(--red); }
    .stat-card.red .number     { color: var(--red);    text-shadow: 0 0 16px rgba(248, 113, 113, 0.25); }
    .stat-card.green   { border-left-color: var(--green); }
    .stat-card.green .number   { color: var(--green); }
    .stat-card.yellow  { border-left-color: var(--amber); }
    .stat-card.yellow .number  { color: var(--amber);  text-shadow: 0 0 16px rgba(251, 191, 36, 0.25); }
    .stat-card.purple  { border-left-color: var(--violet); }
    .stat-card.purple .number  { color: var(--violet); text-shadow: 0 0 16px rgba(167, 139, 250, 0.25); }
    .stat-card .sub { font-size: 11px; color: var(--muted); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-bottom: 22px; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    /* ── Tables ── */
    table { width: 100%; border-collapse: collapse; }
    th {
      font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
      text-align: left; padding: 9px 14px; color: var(--dim);
      border-bottom: 1px solid var(--line); font-weight: 600;
      background: var(--bg-deep);
      position: sticky; top: 0;
    }
    td { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); font-size: 12px; font-variant-numeric: tabular-nums; }
    tbody tr { transition: background .12s; border-left: 3px solid transparent; }
    tbody tr:hover td { background: rgba(74, 222, 128, 0.035); }
    td .payload, td.tabular { font-family: var(--mono); }

    /* ── Severity row accents ── */
    tr.sev-crit  { border-left-color: var(--red-hot); background: rgba(239, 68, 68, 0.045); }
    tr.sev-high  { border-left-color: var(--red); }
    tr.sev-med   { border-left-color: var(--amber); }
    tr.sev-low   { border-left-color: var(--green); }
    tr.sev-low:hover td { background: rgba(74, 222, 128, 0.05); }
    tr.sev-high:hover td, tr.sev-crit:hover td { background: rgba(239, 68, 68, 0.06); }
    tr.sev-med:hover td { background: rgba(251, 191, 36, 0.05); }

    /* ── New-row fade-in (live feed) ── */
    tbody tr.row-new { animation: rowIn .6s ease-out, rowFlash 2.2s ease; }
    @keyframes rowIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
    @keyframes rowFlash { 0% { background: rgba(74, 222, 128, 0.16); } 100% { background: transparent; } }

    /* ── Badges ── */
    .badge {
      display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
      border-radius: 5px; font-size: 10px; font-weight: 600; letter-spacing: .02em;
      border: 1px solid transparent; font-family: var(--mono);
    }
    .badge::before { content: '●'; font-size: 7px; }
    .badge.port_scan         { background: var(--red-fade);   color: var(--red);    border-color: rgba(248, 113, 113, 0.3); }
    .badge.brute_force       { background: rgba(251, 146, 60, 0.10); color: var(--orange); border-color: rgba(251, 146, 60, 0.3); }
    .badge.connection_attempt{ background: var(--green-fade); color: var(--green);  border-color: rgba(74, 222, 128, 0.3); }
    .badge.http_scan         { background: rgba(34, 211, 238, 0.10); color: var(--cyan);   border-color: rgba(34, 211, 238, 0.3); }
    .badge.http_brute_force  { background: rgba(251, 191, 36, 0.10); color: var(--amber);  border-color: rgba(251, 191, 36, 0.3); }
    .badge.admin_panel_access{ background: rgba(167, 139, 250, 0.10); color: var(--violet); border-color: rgba(167, 139, 250, 0.3); }
    .badge.ip_blocked        { background: rgba(239, 68, 68, 0.16); color: var(--red-hot); border-color: rgba(239, 68, 68, 0.45); }
    .badge.sensor-esp32-lan  { background: rgba(34, 211, 238, 0.08); color: var(--cyan);   border-color: rgba(34, 211, 238, 0.3); }
    .badge.sensor-vps-sensor { background: rgba(251, 146, 60, 0.10); color: var(--orange); border-color: rgba(251, 146, 60, 0.3); }
    .badge.sensor-unknown    { background: rgba(148, 163, 184, 0.08); color: var(--dim);    border-color: rgba(148, 163, 184, 0.25); }

    .empty { color: var(--dim); font-size: 12px; padding: 14px 4px; }
    .link { color: var(--green); text-decoration: none; font-weight: 600; transition: color .12s; }
    .link:hover { color: #86efac; text-decoration: underline; text-underline-offset: 3px; }

    /* ── Buttons ── */
    .btn {
      display: inline-block; text-decoration: none; cursor: pointer;
      font-family: var(--mono); font-weight: 700; font-size: 12px;
      color: #03180c; padding: 9px 18px; border: 0; border-radius: 8px;
      background: linear-gradient(135deg, #86efac, var(--green-dim));
      transition: filter .15s, transform .12s, box-shadow .15s;
    }
    .btn:hover { filter: brightness(1.07); transform: translateY(-1px); box-shadow: 0 8px 20px -10px rgba(74, 222, 128, 0.5); }
    .btn.ghost {
      background: transparent; color: var(--green);
      box-shadow: inset 0 0 0 1px rgba(74, 222, 128, 0.4);
    }
    .btn.ghost:hover { color: #86efac; box-shadow: inset 0 0 0 1px var(--green); }

    /* ── Form fields ── */
    .field {
      background: var(--bg-deep); border: 1px solid var(--line); border-radius: 8px;
      color: var(--text); padding: 8px 12px; font-family: var(--mono); font-size: 12px;
      transition: border-color .15s, box-shadow .15s;
    }
    .field:focus { outline: none; border-color: rgba(74, 222, 128, 0.6); box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.12); }
    .field::placeholder { color: var(--dim); }
    .field::-webkit-calendar-picker-indicator { filter: invert(.6) sepia(.5) saturate(3) hue-rotate(80deg); }

    .filterbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

    /* ── Pagination ── */
    .pagination { display: flex; gap: 5px; align-items: center; margin-top: 18px; flex-wrap: wrap; }
    .pagination a, .pagination span {
      font-size: 11.5px; text-decoration: none;
      padding: 6px 12px; color: var(--muted); background: var(--bg-deep);
      border: 1px solid var(--line); border-radius: 6px;
      transition: all .13s;
    }
    .pagination a:hover { color: var(--green); border-color: rgba(74, 222, 128, 0.4); }
    .pagination .current {
      color: #03180c; font-weight: 700; border-color: transparent;
      background: linear-gradient(135deg, #86efac, var(--green-dim));
    }

    .toolbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
    .toolbar .spacer { flex: 1; }

    /* ── Console-style live feed ── */
    .console { padding: 0 !important; overflow: hidden; }
    .console .console-bar {
      display: flex; align-items: center; gap: 10px;
      font-size: 10px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--muted); padding: 11px 16px;
      background: var(--bg-deep); border-bottom: 1px solid var(--line);
    }
    .console .console-bar .rec { color: var(--red-hot); animation: blink 1.3s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .console table { margin: 0; }
    .console td, .console th { padding-left: 18px; padding-right: 18px; font-size: 11.5px; }

    /* ── Alert badge (red pulse on new attack) ── */
    .alert-banner { display: none; }
    .alert-badge {
      display: none; align-items: center; gap: 9px;
      font-size: 11px; font-weight: 700; letter-spacing: .1em;
      color: var(--red-hot);
      background: var(--red-fade);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 999px; padding: 7px 16px;
    }
    .alert-badge .dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--red-hot);
      box-shadow: 0 0 10px var(--red-hot);
    }
    .alert-badge.show {
      display: inline-flex;
      animation: redPulse 1.15s ease-in-out infinite;
    }
    @keyframes redPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.55), 0 0 18px rgba(239, 68, 68, 0.3); }
      50%      { box-shadow: 0 0 0 9px rgba(239, 68, 68, 0), 0 0 28px rgba(239, 68, 68, 0.55); }
    }

    /* legacy alias kept so any page using .alert-banner renders hidden-cleanly */
    .alert-banner.show { display: flex; }

    /* Page fade-in */
    .container > * { animation: fadeUp .4s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(7px); } to { opacity: 1; transform: none; } }

    @media (max-width: 760px) {
      .navbar { justify-content: center; padding: 10px 14px; }
      .container { padding: 18px 14px 50px; }
      .brand .name small { display: none; }
      .page-title { font-size: 17px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .live-pill { display: none; }
    }
  </style>
  {% block head_css %}{% endblock %}
</head>
<body>

<nav class="navbar">
  <a class="brand" href="{% url 'dashboard' %}">
    <svg class="logo-hex" viewBox="0 0 40 40">
      <defs><linearGradient id="hexg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#86efac"/><stop offset="1" stop-color="#22c55e"/>
      </linearGradient></defs>
      <path d="M20 2 36 11v18L20 38 4 29V11z" fill="none" stroke="url(#hexg)" stroke-width="2"/>
      <path d="M20 8 30 14v12L20 32 10 26V14z" fill="rgba(74,222,128,0.10)" stroke="url(#hexg)" stroke-width="1"/>
      <circle class="core" cx="20" cy="20" r="2.8" fill="#86efac"/>
    </svg>
    <span class="name">
      <b>Hive Sentinel</b>
      <small>SOC · THREAT CONSOLE</small>
    </span>
  </a>
  <div class="links">
    <a href="{% url 'dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">Dashboard</a>
    <a href="{% url 'attack_logs' %}" class="{% if request.resolver_match.url_name == 'attack_logs' %}active{% endif %}">Attack Log</a>
    <a href="{% url 'threat_map' %}" class="{% if request.resolver_match.url_name == 'threat_map' %}active{% endif %}">Threat Map</a>
    <a href="{% url 'attackers' %}" class="{% if request.resolver_match.url_name == 'attackers' or request.resolver_match.url_name == 'attacker_detail' %}active{% endif %}">Attackers</a>
    <a href="{% url 'reports' %}" class="{% if request.resolver_match.url_name == 'reports' %}active{% endif %}">Reports</a>
  </div>
  <div class="right">
    <span class="live-pill"><span class="dot"></span>LIVE</span>
    <span class="user">{{ request.user.username }}</span>
    <form method="post" action="{% url 'logout' %}">
      {% csrf_token %}
      <button type="submit" class="logout">Logout</button>
    </form>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

{% block scripts %}{% endblock %}
</body>
</html>
